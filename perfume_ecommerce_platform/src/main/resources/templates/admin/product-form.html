<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ürün Ekle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h4 class="mb-4 text-primary">Hızlı Ürün Ekle</h4>

        <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="row mb-3">
                <div class="col">
                    <label>Marka</label>
                    <input type="text" class="form-control" th:field="*{brand}" required>
                </div>
                <div class="col">
                    <label>Parfüm Adı</label>
                    <input type="text" class="form-control" th:field="*{name}" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="fw-bold">Kategori Seç</label>
                <select class="form-select" th:field="*{categoryId}" required>
                    <option value="">Bir kategori seçin...</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.gender} + ' - ' + ${cat.concentration} + ' (' + ${cat.season} + ')'">
                        ERKEK - EDP (KIŞ)
                    </option>
                </select>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label>Fiyat</label>
                    <input type="number" class="form-control" th:field="*{price}" required>
                </div>
                <div class="col">
                    <label>Stok (stockQuantity)</label>
                    <input type="number" class="form-control" th:field="*{stockQuantity}" required>
                </div>
            </div>

            <div class="mb-3">
                <label>Resim URL</label>
                <input type="text" class="form-control" th:field="*{imageUrl}">
            </div>
            <div class="mb-3">
                <label>Açıklama</label>
                <textarea class="form-control" th:field="*{description}" rows="2"></textarea>
            </div>

            <hr>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="text-success fw-bold">Üst Notalar (Top)</label>
                    <select class="form-select" th:field="*{topNoteIds}" multiple size="5">
                        <option th:each="note : ${topNotes}" th:value="${note.id}" th:text="${note.name}"></option>
                    </select>
                    <small class="text-muted">Ctrl tuşuyla çoklu seç</small>
                </div>
                <div class="col-md-4">
                    <label class="text-danger fw-bold">Kalp Notalar (Heart)</label>
                    <select class="form-select" th:field="*{heartNoteIds}" multiple size="5">
                        <option th:each="note : ${heartNotes}" th:value="${note.id}" th:text="${note.name}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="text-warning fw-bold">Alt Notalar (Base)</label>
                    <select class="form-select" th:field="*{baseNoteIds}" multiple size="5">
                        <option th:each="note : ${baseNotes}" th:value="${note.id}" th:text="${note.name}"></option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100">Kaydet</button>
        </form>
    </div>
</div>

</body>
</html>
