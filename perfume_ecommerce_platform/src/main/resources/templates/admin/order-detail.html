<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sipariş Detayı</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <a href="/admin/orders" class="btn btn-secondary mb-3">&larr; Listeye Dön</a>

    <div class="card">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Sipariş #<span th:text="${order.id}"></span> Detayı</h4>
            <span>Toplam: <b th:text="${order.totalPrice} + ' TL'"></b></span>
        </div>
        <div class="card-body">

            <form action="/admin/orders/update-status" method="post" class="row g-3 align-items-center mb-4 p-3 border rounded bg-light">
                <input type="hidden" name="orderId" th:value="${order.id}">
                <div class="col-auto">
                    <label class="col-form-label fw-bold">Sipariş Durumu:</label>
                </div>
                <div class="col-auto">
                    <select name="status" class="form-select">
                        <option th:each="st : ${allStates}"
                                th:value="${st}"
                                th:text="${st}"
                                th:selected="${st == order.state}"></option>
                    </select>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-success">Güncelle</button>
                </div>
            </form>

            <h5>Satın Alınan Ürünler</h5>
            <table class="table table-bordered">
                <thead>
                <tr>
                    <th>Ürün Adı</th>
                    <th>Adet</th>
                    <th>Birim Fiyat</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${order.items}">
                    <td th:text="${item.product.name}">Chanel No 5</td>
                    <td th:text="${item.quantity}">2</td>
                    <td th:text="${item.lineTotal}">1500 TL</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="row mb-4">
    <div class="col-md-6">
        <h5>Sipariş Sahibi</h5>
        <p>
            <strong th:text="${order.user.firstName} + ' ' + ${order.user.lastName}">
                User Name
            </strong>
        </p>
        <p>
            E-posta:
            <span th:text="${order.user.email}">user@example.com</span>
        </p>
        <p>
            Telefon:
            <span th:text="${order.user.phoneNumber}">555 000 00 00</span>
        </p>
    </div>
    <div class="col-md-6">
        <h5>Teslimat Adresi</h5>
        <p th:text="${order.shippingStreet} + ' ' + ${order.shippingDetail}">
            Sokak / Bina / Daire
        </p>
        <p th:text="${order.shippingCity}">İstanbul</p>
        <!-- İstersen state de ekleyebilirsin -->
        <p>
            Durum:
            <span th:text="${order.state}">DELIVERED</span>
        </p>
    </div>
</div>
</body>
</html>
