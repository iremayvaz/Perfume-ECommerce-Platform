<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sipariş Yönetimi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Sipariş Geçmişi</h2>

    <a th:href="@{/admin/dashboard}" class="btn btn-secondary">
        ← Dashboard'a Dön
    </a>

    <table class="table table-striped mt-3">
        <thead class="table-dark">
        <tr>
            <th>Sipariş No</th>
            <th>Müşteri</th>
            <th>Tarih</th>
            <th>Tutar</th>
            <th>Durum</th>
            <th>İşlem</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}">#123</td>
            <td th:text="${order.user.firstName} + ' ' + ${order.user.lastName}">Ahmet Yılmaz</td>
            <td th:text="${order.createdAt}">01.01.2023</td>
            <td th:text="${order.totalPrice} + ' TL'">500 TL</td>
            <td>
                    <span class="badge bg-secondary"
                          th:classappend="${order.state.name() == 'TESLIM_EDILDI' ? 'bg-success' : (order.state.name() == 'IPTAL_EDILDI' ? 'bg-danger' : 'bg-warning')}"
                          th:text="${order.state}">HAZIRLANIYOR</span>
            </td>
            <td>
                <a th:href="@{/admin/orders/{id}(id=${order.id})}" class="btn btn-info btn-sm">Yönet</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
