<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Stok Güncelle</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="container mt-4">

    <a th:href="@{/admin/dashboard}" class="btn btn-secondary mb-3">&larr; Dashboard'a Dön</a>

    <h2>Stok Güncelle</h2>

    <div class="card mt-3">
        <div class="card-body">
            <p><strong>Marka:</strong> <span th:text="${product.brand}"></span></p>
            <p><strong>Parfüm Adı:</strong> <span th:text="${product.name}"></span></p>
            <p><strong>Mevcut Stok:</strong>
                <span th:text="${product.stockQuantity}"></span>
            </p>

            <form th:action="@{'/admin/products/' + ${product.id} + '/stock'}"
                  method="post">

                <div class="mb-3">
                    <label for="amount" class="form-label">
                        Eklenecek Miktar
                    </label>
                    <input type="number" id="amount" name="amount"
                           class="form-control" min="1" required>
                </div>

                <button type="submit" class="btn btn-success">Stok Artır</button>
                <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">
                    İptal
                </a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
