<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Ürün Listesi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Parfüm Yönetim Paneli</h2>
        <div>
            <a href="/admin/dashboard" class="btn btn-secondary me-2">Dashboard'a Dön</a>
            <a href="/admin/products/new" class="btn btn-primary">Yeni Parfüm Ekle</a>
        </div>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Marka</th>
            <th>İsim</th>
            <th>Stok</th> <th>Fiyat</th>
            <th>İşlemler</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="perfume : ${products}"
            th:classappend="${perfume.stockQuantity <= 3 ? 'table-danger' : ''}">

            <td th:text="${perfume.id}">1</td>
            <td th:text="${perfume.brand}">Chanel</td>
            <td th:text="${perfume.name}">No 5</td>

            <td>
                <span th:text="${perfume.stockQuantity}" class="fw-bold">10</span>
                <i th:if="${perfume.stockQuantity <= 3}"
                   class="fas fa-exclamation-circle text-danger ms-2"
                   title="Kritik Stok Seviyesi!"></i>
            </td>

            <td th:text="${perfume.price} + ' TL'">3000 TL</td>
            <td>
                <a th:href="@{/admin/products/edit/{id}(id=${perfume.id})}"
                   class="btn btn-sm btn-primary">
                    Düzenle
                </a>

                <a th:href="@{/admin/products/delete/{id}(id=${perfume.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Silmek istediğine emin misin?');">
                    Sil
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
